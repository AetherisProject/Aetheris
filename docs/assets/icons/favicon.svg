<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" height="100%">
  <defs>
    <!-- Background Radial Aura (Transparent Falloff) -->
    <radialGradient id="aeth-core-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Beveled Armor Metal Gradients -->
    <linearGradient id="armor-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="armor-rim" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Neon Cyber Conduits -->
    <linearGradient id="neon-cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="neon-cyan-pure" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Gold / Key Accent -->
    <linearGradient id="gold-key" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Carbon Pattern -->
    <pattern id="carbon-weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0c0e15"/>
      <polygon points="0,0 4,0 0,4" fill="#131722"/>
      <polygon points="4,4 8,4 4,8" fill="#131722"/>
      <polygon points="4,0 8,4 8,0" fill="#171c2b"/>
      <polygon points="0,4 4,8 0,8" fill="#171c2b"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="hyper-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow-deep" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Top Aerospace Eagle Wing Accent (matching Merlin Tribukait crest hallmark) -->
  <g transform="translate(450, 85)" filter="url(#soft-glow)">
    <!-- Central Shield Crest Mini -->
    <polygon points="0,-25 22,-12 18,15 0,28 -18,15 -22,-12" fill="#1e293b" stroke="url(#armor-outer)" stroke-width="2.5"/>
    <text x="0" y="7" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="16" fill="#06b6d4">Æ</text>
    
    <!-- Left Wing Feathers -->
    <path d="M -26,-6 L -75,-28 L -140,-24 L -85,-8 L -120,4 L -75,6 L -100,18 L -60,16 L -26,10 Z" fill="#131722" stroke="url(#armor-outer)" stroke-width="2"/>
    <path d="M -30,-2 L -85,-20 L -130,-18" stroke="#06b6d4" stroke-width="1.8" fill="none" opacity="0.8"/>

    <!-- Right Wing Feathers -->
    <path d="M 26,-6 L 75,-28 L 140,-24 L 85,-8 L 120,4 L 75,6 L 100,18 L 60,16 L 26,10 Z" fill="#131722" stroke="url(#armor-outer)" stroke-width="2"/>
    <path d="M 30,-2 L 85,-20 L 130,-18" stroke="#a855f7" stroke-width="1.8" fill="none" opacity="0.8"/>
  </g>

  <!-- Heavy Outer Armored Shield Chassis -->
  <g filter="url(#shadow-deep)">
    <!-- Outermost Beveled Crest Plating -->
    <polygon points="450,110 740,210 710,600 450,800 190,600 160,210" 
             fill="#0f131d" stroke="url(#armor-outer)" stroke-width="10" stroke-linejoin="round"/>

    <!-- Outer Bolt Fasteners (8 Heavy Mechanical Studs) -->
    <circle cx="450" cy="130" r="5" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
    <circle cx="718" cy="225" r="5" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
    <circle cx="692" cy="580" r="5" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
    <circle cx="450" cy="775" r="5" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
    <circle cx="208" cy="580" r="5" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
    <circle cx="182" cy="225" r="5" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
    <circle cx="300" cy="160" r="4" fill="#94a3b8"/>
    <circle cx="600" cy="160" r="4" fill="#94a3b8"/>

    <!-- High-Tension Neon Energy Channel -->
    <polygon points="450,140 705,230 678,575 450,755 222,575 195,230" 
             fill="none" stroke="url(#neon-cyan-violet)" stroke-width="5" filter="url(#hyper-glow)"/>

    <!-- Secondary Bevel Layer -->
    <polygon points="450,165 675,250 650,550 450,715 250,550 225,250" 
             fill="url(#carbon-weave)" stroke="#1e293b" stroke-width="4"/>
  </g>

  <!-- Circuit Trace Infrastructure Matrix (Representing API Key Hub & Multi-Cloud Mesh) -->
  <g stroke="#334155" stroke-width="1.8" fill="none" opacity="0.65">
    <path d="M 270,300 L 320,300 L 350,330 L 350,420"/>
    <circle cx="270" cy="300" r="3" fill="#06b6d4"/>
    
    <path d="M 630,300 L 580,300 L 550,330 L 550,420"/>
    <circle cx="630" cy="300" r="3" fill="#a855f7"/>

    <path d="M 300,500 L 340,500 L 370,530 L 450,530"/>
    <circle cx="300" cy="500" r="3" fill="#10b981"/>

    <path d="M 600,500 L 560,500 L 530,530 L 450,530"/>
    <circle cx="600" cy="500" r="3" fill="#f59e0b"/>
  </g>

  <!-- CENTER EMBLEM: The Aetheris Monogram "A" + Vault Keyhole + Terminal Chevron -->
  <g transform="translate(450, 425)">
    <!-- Glowing Aura Behind Core Monogram -->
    <circle cx="0" cy="-10" r="150" fill="url(#aeth-core-glow)" filter="url(#hyper-glow)"/>

    <!-- Center 3D Armored "A" Chassis (Outer Shell) -->
    <!-- Left Leg of A -->
    <polygon points="0,-180 -30,-180 -140,110 -85,110 -55,30 -5,30 0,-180" 
             fill="#121726" stroke="url(#armor-outer)" stroke-width="6" stroke-linejoin="round"/>
    <!-- Right Leg of A -->
    <polygon points="0,-180 30,-180 140,110 85,110 55,30 5,30 0,-180" 
             fill="#181f33" stroke="url(#armor-outer)" stroke-width="6" stroke-linejoin="round"/>

    <!-- Neon Core Lightpaths Along "A" Geometry -->
    <path d="M -20,-150 L -105,90" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" filter="url(#soft-glow)"/>
    <path d="M 20,-150 L 105,90" stroke="#a855f7" stroke-width="5" stroke-linecap="round" filter="url(#soft-glow)"/>
    <path d="M 0,-165 L 0,-20" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>

    <!-- Horizontal Crossbar of "A" — Designed as an Interlocking SSH/Vault Cryptographic Bolt -->
    <g transform="translate(0, 30)">
      <polygon points="-80,-15 80,-15 70,18 -70,18" fill="#1e293b" stroke="url(#armor-outer)" stroke-width="3"/>
      <line x1="-65" y1="2" x2="65" y2="2" stroke="url(#neon-cyan-violet)" stroke-width="4" filter="url(#soft-glow)"/>
    </g>

    <!-- CENTERPIECE: Vault Keyhole + Interactive Terminal Chevron (>_) -->
    <!-- Cryptographic Shield Lock Cavity -->
    <circle cx="0" cy="-25" r="42" fill="#080a10" stroke="url(#armor-rim)" stroke-width="4"/>
    <circle cx="0" cy="-25" r="35" fill="#04060a" stroke="url(#neon-cyan-pure)" stroke-width="2" filter="url(#soft-glow)"/>

    <!-- High-Security Keyhole Chamber -->
    <path d="M -11,-34 A 14 14 0 0 1 11,-34 L 16,-6 L 8,3 L 8,14 L -8,14 L -8,3 L -16,-6 Z" 
          fill="url(#gold-key)" stroke="#fef08a" stroke-width="1.5" filter="url(#soft-glow)"/>
    <circle cx="0" cy="-33" r="5" fill="#080a10"/>

    <!-- Interactive Terminal Command Chevron Nested Inside the Bottom Apex -->
    <g transform="translate(0, 65)" filter="url(#soft-glow)">
      <!-- Chevron '>' prompt -->
      <polyline points="-25,-14 -10,0 -25,14" fill="none" stroke="#06b6d4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Terminal Cursor '_' -->
      <line x1="2" y1="12" x2="24" y2="12" stroke="#10b981" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Lower Tech Spec Callouts (Moshi-grade Rust Velocity & Zero Knowledge) -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" letter-spacing="2">
    <text x="210" y="650">SEC//XCHACHA20-POLY1305</text>
    <text x="690" y="650" text-anchor="end">CORE//NATIVE-RUST-v0.1</text>
  </g>

  <!-- Brand Typography Lockup (Merlin Tribukait Spec) -->
  <g transform="translate(450, 835)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-weight="900" font-size="34" fill="#ffffff" letter-spacing="6">A E T H E R I S</text>

    <!-- Subtitle Lockup with Cyan Neon Accents -->
    <text x="0" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" 
          font-weight="700" font-size="12.5" fill="#06b6d4" letter-spacing="4">THE SECRETS OPERATING SYSTEM • ZERO-KNOWLEDGE HUB</text>
    
    <!-- Division rule -->
    <line x1="-220" y1="36" x2="220" y2="36" stroke="url(#neon-cyan-violet)" stroke-width="1.5" opacity="0.75"/>
    <text x="0" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" 
          font-weight="500" font-size="10" fill="#94a3b8" letter-spacing="3">MERLIN TRIBUKAIT ECOSYSTEM • AETHERIS.MERLIN-TRIBUKAIT.COM</text>
  </g>
</svg>
