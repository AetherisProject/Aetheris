[package]
name = "aetheris"
version = "0.1.0"
edition = "2021"
description = "Aetheris: The Secrets Operating System — unified SSH terminal, password vault, API key manager, and zero-knowledge sync platform."
readme = "README.md"
license = "MIT"
repository = "https://github.com/merlin-tribukait/Aetheris"
authors = ["Merlin Tribukait <merlin@aetheris.dev>"]
keywords = [
    "ssh",
    "terminal",
    "vault",
    "password-manager",
    "api-key",
    "secrets",
    "zero-knowledge",
    "encryption",
    "sync",
    "tui",
    "security",
    "aetheris",
]
categories = [
    "command-line-utilities",
    "cryptography",
    "authentication",
    "networking",
    "development-tools",
]

[lib]
name = "aetheris"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "aeth"
path = "src/main.rs"

[[example]]
name = "design_demo"
path = "examples/design_demo.rs"

[features]
default = ["cli"]
cli = ["dep:ratatui", "dep:crossterm"]
desktop = ["cli"]
web = ["dep:axum", "dep:tower-http"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]
mobile = []
full = ["cli", "desktop", "web"]
[dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# CLI / TUI
ratatui = { version = "0.26", optional = true }
crossterm = { version = "0.27", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
serde_yaml = "0.9"

# Cryptography
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
argon2 = { version = "0.5", features = ["password-hash"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = "2"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.8"

# SSH
russh = "0.43"
russh-keys = "0.43"

# AWS SDK / S3 Sync
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "credentials-process", "sso", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "http-1x", "sigv4a"] }
aws-smithy-http-client = { version = "1.2", features = ["default-client", "rustls-ring"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

# Web server (optional)
axum = { version = "0.8", optional = true, features = ["ws", "macros"] }
tower-http = { version = "0.5", optional = true, features = ["cors", "fs", "trace"] }

# WASM support (optional)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true }

# CLI parsing
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging / Debug
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Configuration / Environment
dotenvy = "0.15"
config = "0.14"
which = "8"

# Database
sled = "0.34"

# File system / Paths
dirs = "5"
walkdir = "2"
tempfile = "3"

# Time / Date
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Encoding / Parsing
base64 = "0.22"
hex = "0.4"
regex = "1"
bincode = "1.3"

# Async utilities
async-trait = "0.1"
pin-project = "1"

# Concurrency
parking_lot = "0.12"
dashmap = "5"

# TOTP / MFA
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }

# i18n
fluent = "0.16"
fluent-bundle = "0.15"
unic-langid = "0.9"

# Password generation
passwords = "3"
rpassword = "7"
# Clipboard (desktop)
arboard = { version = "3", optional = true }

# Keychain / OS keychain (cross-platform)
keyring = { version = "2", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"
mockall = "0.12"
proptest = "1"
fake = { version = "2", features = ["derive"] }
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
opt-level = 3
debug = false
lto = "thin"

[workspace]
members = []
resolver = "2"