[package]
name = "Aetheris"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "9.0"
chrono = "0.4"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
tch = "0.13"

[dev-dependencies]
proptest = "1.0"

[workspace]
members = ["src"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[lib]
name = "aetheris"
path = "src/lib.rs"