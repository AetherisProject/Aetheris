[package]
name = "aetheris"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { version = "1.0.81" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.0.0", features = ["full"] }
sled = "0.34.7"
uuid = { version = "1.4.1", features = ["v4"] }

# Crypto
oqs = { version = "0.11.0", features = ["kyber", "dilithium"] }
zeroize = "1.9.0"
subtle = "0.3.1"

# Security
secrecy = "0.8.0"

# Vault
bincode = "1.3.3"

# UI
ratatui = "0.26.3"

# Web
tokio-web = "0.26.0"

[features]
default = []
apikey = []

[build-dependencies]
cargo = "0.80.0"

[target."cfg(unix)".dependencies]
libc = "0.2.148"

[target."cfg(target_arch = "wasm32")".dependencies]
wasm-bindgen = "0.2.0"
web-sys = { version = "0.3.0", features = ["Window", "Document", "HtmlElement", "console"] }

[target."cfg(target_os = "windows")".dependencies]
winapi = { version = "0.3.9", features = ["ws2_32"] }

[dev-dependencies]
proptest = "1.11.0"
proptest-derive = "0.3.4"