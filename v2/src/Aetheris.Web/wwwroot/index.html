<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aetheris</title>
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#090D16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Preload libsodium.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sodium.js/0.7.13/sodium.min.js"></script>
</head>
<body>
    <div id="app">
        <div class="boot">◈ Aetheris is loading…</div>
    </div>
    
    <!-- Load Blazor WASM -->
    <script src="_framework/blazor.webassembly.js"></script>
    
    <!-- Load custom JS modules -->
    <script type="module">
        import '/js/argon2.js';
        import '/js/crypto.js';
        import '/js/totp.js';
        import '/js/clipboard.js';
        import '/js/offline-queue.js';
    </script>
    
    <!-- Register service worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
        
        // Setup tab visibility listener for auto-lock
        function setupTabVisibilityListener() {
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    // This will be called from Blazor via JS interop
                    if (window.setupTabVisibilityListenerFromDotNet) {
                        window.setupTabVisibilityListenerFromDotNet();
                    }
                }
            });
        }
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', setupTabVisibilityListener);
        } else {
            setupTabVisibilityListener();
        }
    </script>
</body>
</html>
