<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Aetheris Chat</title>
    <style>
        body {
            width: 400px;
            height: 500px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eaeaea;
            margin: 0;
            overflow: hidden;
        }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        
        .header h1 {
            margin: 0;
            color: #0f3460;
            font-size: 18px;
        }
        
        .header p {
            margin: 5px 0 0 0;
            color: #888;
            font-size: 12px;
        }
        
        .model-selector {
            margin-bottom: 15px;
        }
        
        .model-selector select {
            width: 100%;
            padding: 8px;
            background: #16213e;
            color: #eaeaea;
            border: 1px solid #0f3460;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100% - 120px);
            overflow: hidden;
        }
        
        .conversation {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 10px;
            background: #0f3460;
            border-radius: 4px;
            min-height: 200px;
        }
        
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            line-height: 1.4;
        }
        
        .message.user {
            background: #16213e;
            border-left: 3px solid #e94560;
        }
        
        .message.assistant {
            background: #1a1a2e;
            border-left: 3px solid #0f0;
        }
        
        .message.system {
            background: #0f3460;
            border-left: 3px solid #ffa500;
            font-size: 12px;
            color: #888;
        }
        
        .input-area {
            display: flex;
            gap: 10px;
        }
        
        .input-area input {
            flex: 1;
            padding: 10px;
            background: #16213e;
            color: #eaeaea;
            border: 1px solid #0f3460;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .input-area input:focus {
            outline: none;
            border-color: #e94560;
        }
        
        .input-area button {
            padding: 10px 20px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .input-area button:hover {
            background: #c0392b;
        }
        
        .input-area button:disabled {
            background: #333;
            cursor: not-allowed;
        }
        
        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
            text-align: center;
        }
        
        .status.online {
            color: #0f0;
        }
        
        .status.offline {
            color: #e94560;
        }
        
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #e94560;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Aetheris Chat</h1>
        <p>Puter Models via Local LLM</p>
    </div>
    
    <div class="model-selector">
        <select id="modelSelect">
            <option value="">Loading models...</option>
        </select>
    </div>
    
    <div class="chat-container">
        <div class="conversation" id="conversation">
            <div class="message system">Select a model and start chatting</div>
        </div>
        
        <div class="input-area">
            <input type="text" id="promptInput" placeholder="Type your message..." autocomplete="off">
            <button id="sendButton" disabled>Send</button>
        </div>
    </div>
    
    <div class="status" id="status">
        <span id="serverStatus">Checking server...</span>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
