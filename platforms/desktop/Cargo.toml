[package]
name = "aetheris-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aetheris-desktop"
path = "src-tauri/main.rs"

[dependencies]
aetheris-core = { path = "../../core" }
tauri = { version = "2.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
parking_lot = "0.12"

[build-dependencies]
tauri-build = { version = "2.0" }
