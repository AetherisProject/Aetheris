[package]
name = "aetheris-ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "aetheris_ffi"
crate-type = ["cdylib"]

[dependencies]
aetheris-core = { path = "../../../core" }
flutter_rust_bridge = "1.82.0"
jni = { version = "0.21.1", features = ["invocation"] }
libc = "0.2"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
[build-dependencies]
flutter_rust_bridge_codegen = "2.5.1"