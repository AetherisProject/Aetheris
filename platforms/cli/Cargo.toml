[package]
name = "aetheris-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
aetheris-core = { path = "../../core" }
clap = { version = "4.0", features = ["derive"] }
crossterm = "0.27"
futures-util = "0.3"
ratatui = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "aetheris-cli"
path = "src/main.rs"

[[bin]]
name = "aetheris-chat"
path = "src/chat.rs"