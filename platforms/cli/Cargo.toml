[package]
name = "aetheris-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aetheris"
path = "src/main.rs"

[dependencies]
aetheris-core = { path = "../../core" }
ratatui = "0.26.0"
crossterm = "0.27.0"
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"