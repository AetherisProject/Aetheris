name: Browser CI
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y zip
          chmod +x browser/build.sh
          ./browser/build.sh
      - name: Validate manifest JSON
        run: python3 -c "import json; json.load(open('browser/chrome/manifest.json')); print('manifest OK')"
      - name: Verify zip contents
        run: |
          if [ -f browser/dist/aetheris-browser.zip ]; then
            unzip -l browser/dist/aetheris-browser.zip | grep -E 'popup.html|background.js|manifest.json|popup.js|options.js' || echo "some plugin files missing in zip"
          else
            echo "zip not found (expected after build)"
          fi
