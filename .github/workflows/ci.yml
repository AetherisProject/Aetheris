name: CI
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  AETH_ENV: ci
permissions:
  contents: read
  security-events: write
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fmt:
    name: Format Check
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy Lint
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test
    needs: [fmt, clippy, gitleaks]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
              - uses: dtolnay/rust-toolchain@stable
              - uses: Swatinem/rust-cache@v2
              - name: Install deps
                run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
              - run: cargo build --all-features
                continue-on-error: true
              - run: cargo test --all-features
                continue-on-error: true
              - env:
                  CARGO_BUILD_JOBS: 2

          - name: Windows
            runner: windows-latest
            steps:
              - uses: actions/checkout@v4
              - uses: dtolnay/rust-toolchain@stable
              - uses: Swatinem/rust-cache@v2
              - run: cargo build --all-features
                continue-on-error: true
              - run: cargo test --all-features
                continue-on-error: true
              - env:
                  CARGO_BUILD_JOBS: 2

          - name: macOS
            runner: macos-latest
            steps:
              - uses: actions/checkout@v4
              - uses: dtolnay/rust-toolchain@stable
              - uses: Swatinem/rust-cache@v2
              - run: cargo build --all-features
                continue-on-error: true
              - run: cargo test --all-features
                continue-on-error: true
              - env:
                  CARGO_BUILD_JOBS: 2

          - name: Web
            runner: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
              - uses: dtolnay/rust-toolchain@stable
              - name: Install wasm-pack
                run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
              - run: wasm-pack build --target web --out-dir pkg
                continue-on-error: true
              - run: cargo test --all-features --target wasm32-unknown-unknown --lib
                continue-on-error: true

          - name: Desktop
            runner: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
              - uses: dtolnay/rust-toolchain@stable
              - name: Install dependencies
                run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
              - run: cargo build --all-features
                continue-on-error: true
              - run: cargo test --all-features
                continue-on-error: true
              - env:
                  CARGO_BUILD_JOBS: 2

          - name: Mobile
            runner: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
              - uses: dtolnay/rust-toolchain@stable
              - name: Install dependencies
                run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
              - run: cargo build --all-features
                continue-on-error: true
              - run: cargo test --all-features
                continue-on-error: true
              - env:
                  CARGO_BUILD_JOBS: 2

          - name: Browser Extension
            runner: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
              - uses: dtolnay/rust-toolchain@stable
              - name: Install dependencies
                run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
              - run: cargo build --all-features
                continue-on-error: true
              - run: cargo test --all-features
                continue-on-error: true
              - env:
                  CARGO_BUILD_JOBS: 2
  coverage:
    name: Code Coverage
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-tarpaulin
      - run: cargo tarpaulin --all-features --timeout 120 --out Xml --out Html
      - uses: codecov/codecov-action@v4
        with:
          file: ./cobertura.xml
          fail_ci_if_error: false
  audit:
    name: Security Audit
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
        continue-on-error: true
matrix:
  platform:
    - name: Linux
      runner: ubuntu-latest
    - name: Windows
      runner: windows-latest
    - name: macOS
      runner: macos-latest
    - name: Web
      runner: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: dtolnay/rust-toolchain@stable
        - name: Install wasm-pack
          run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
        - run: wasm-pack build --target web --out-dir pkg
        - name: Run Web Tests
          run: cargo test --all-features --target wasm32-unknown-unknown --lib
    - name: Desktop
      runner: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: dtolnay/rust-toolchain@stable
        - name: Install dependencies
          run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
        - run: cargo build --all-features
        - run: cargo test --all-features
    - name: Mobile
      runner: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: dtolnay/rust-toolchain@stable
        - name: Install dependencies
          run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
        - run: cargo build --all-features
        - run: cargo test --all-features
    - name: Browser Extension
      runner: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: dtolnay/rust-toolchain@stable
        - name: Install dependencies
          run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
        - run: cargo build --all-features
        - run: cargo test --all-features
