name: Mobile CI
on: [push, pull_request]
jobs:
  mobile-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.0', channel: 'stable' }
      - run: |
          chmod +x mobile/build.sh
          ./mobile/build.sh
