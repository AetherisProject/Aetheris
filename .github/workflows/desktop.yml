name: Desktop CI
on: [push, pull_request]
jobs:
  desktop-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          chmod +x desktop/test_build.sh
          ./desktop/test_build.sh
