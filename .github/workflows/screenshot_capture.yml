name: CI Build and Screenshot Capture

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [web, desktop]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot libwebkit2gtk-4.0-dev libgtk-3-dev libsoup-2.4-dev
          npm install -g playwright
          playwright install

      - name: Build for ${{ matrix.platform }}
        run: |
          cargo build --release 2>&1

      - name: Capture Web Screenshot
        if: matrix.platform == 'web'
        run: |
          mkdir -p screenshots
          node -e "
            const { chromium } = require('playwright');
            (async () => {
              try {
                const browser = await chromium.launch();
                const page = await browser.newPage();
                await page.goto('about:blank');
                await page.screenshot({ path: 'screenshots/web_screenshot.png' });
                await browser.close();
                console.log('Web screenshot captured');
              } catch (e) {
                console.log('Web screenshot failed:', e);
              }
            })();
          " || echo "Web screenshot capture failed"

      - name: Capture Desktop Screenshot
        if: matrix.platform == 'desktop'
        run: |
          mkdir -p screenshots
          Xvfb :99 -screen 0 1024x768x16 & export DISPLAY=:99
          scrot screenshots/desktop_screenshot.png 2>/dev/null || echo "scrot failed"
          killall Xvfb 2>/dev/null || true

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: "screenshots-${{ matrix.platform }}"
          path: |
            screenshots/*.png
          retention-days: 7