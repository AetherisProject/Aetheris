name: Test Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run tests with coverage
        run: |
          cargo tarpaulin --out Xml --run-types Tests -- --test-threads=1 2>&1 || echo "Tarpaulin failed, falling back to cargo test"
          cargo test --lib -- --test-threads=1 2>&1

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: "coverage-report-${{ github.run_id }}"
          path: |
            cobertura.xml
            tarpaulin-report.html
          retention-days: 7

      - name: Generate HTML report
        run: |
          cargo tarpaulin --out Html --run-types Tests 2>&1 || echo "HTML report generation failed"

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: "coverage-html-${{ github.run_id }}"
          path: tarpaulin-report.html
          retention-days: 7

  coverage-summary:
    runs-on: ubuntu-latest
    needs: test-coverage

    steps:
      - uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: "coverage-report-${{ github.run_id }}"
          path: coverage

      - name: Parse and display coverage
        run: |
          if [ -f coverage/cobertura.xml ]; then
            echo "✓ Coverage report generated"
            # Parse the XML report to get line coverage
            grep -oP '<line-rate>\d+\.\d+</line-rate>' coverage/cobertura.xml | head -1 | sed 's/<line-rate>\(.*\)<\/line-rate>/Line Coverage: \1%/' || echo "Could not parse coverage"
          else
            echo "✗ Coverage report not found"
          fi

      - name: Check coverage threshold
        run: |
          if [ -f coverage/cobertura.xml ]; then
            COVERAGE=$(grep -oP '<line-rate>\d+\.\d+</line-rate>' coverage/cobertura.xml | head -1 | sed 's/<line-rate>\(.*\)<\/line-rate>\1/')
            echo "Current coverage: ${COVERAGE}%"
            
            # Check if coverage meets threshold (80%)
            if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
              echo "✓ Coverage threshold met (${COVERAGE}% >= 80%)"
            else
              echo "⚠️ Coverage threshold not met (${COVERAGE}% < 80%)"
              echo "::warning::Test coverage below 80% threshold"
            fi
          else
            echo "✗ Could not determine coverage"
          fi