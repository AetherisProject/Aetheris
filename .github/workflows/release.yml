name: Release Builds

on:
  push:
    tags:
      - 'v*'

jobs:
  # --- Desktop Builds ---
  build-desktop:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: aetheris-desktop-windows
            artifact_path: platforms/desktop/target/${{ matrix.target }}/release/aetheris-desktop.exe
            release_name: Aetheris Desktop (Windows)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: aetheris-desktop-macos
            artifact_path: platforms/desktop/target/${{ matrix.target }}/release/bundle/macos/Aetheris.app
            release_name: Aetheris Desktop (macOS)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: aetheris-desktop-linux
            artifact_path: platforms/desktop/target/${{ matrix.target }}/release/aetheris-desktop
            release_name: Aetheris Desktop (Linux)

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libsoup-2.4-dev

      - name: Build Tauri App
        run: |
          cd platforms/desktop
          cargo tauri build --target ${{ matrix.target }}

      - name: Compress macOS App
        if: matrix.os == 'macos-latest'
        run: |
          cd platforms/desktop/target/${{ matrix.target }}/release/bundle/macos
          tar -czvf ../../../../../../aetheris-desktop-macos.tar.gz Aetheris.app

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact_path }}
            aetheris-desktop-macos.tar.gz
          name: ${{ matrix.release_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Mobile Builds ---
  build-mobile:
    name: Mobile (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            target: arm64-v8a-linux-android
            artifact_name: aetheris-mobile-android
            artifact_path: platforms/mobile/build/app/outputs/flutter-apk/app-release.apk
            release_name: Aetheris Mobile (Android)
          - platform: ios
            os: macos-latest
            target: aarch64-apple-ios
            artifact_name: aetheris-mobile-ios
            artifact_path: platforms/mobile/build/ios/iphoneos/Runner.app
            release_name: Aetheris Mobile (iOS)

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.0"

      - name: Install Android NDK (Android)
        if: matrix.platform == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-ndk

      - name: Install iOS Dependencies (iOS)
        if: matrix.platform == 'ios'
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          sudo xcodebuild -runFirstLaunch

      - name: Build Rust FFI
        run: |
          cd platforms/mobile/lib
          cargo build --target ${{ matrix.target }} --release

      - name: Build Flutter App
        run: |
          cd platforms/mobile
          flutter pub get
          if [ "${{ matrix.platform }}" = "android" ]; then
            flutter build apk --release
          else
            flutter build ios --release --no-codesign
          fi

      - name: Compress iOS App
        if: matrix.platform == 'ios'
        run: |
          cd platforms/mobile/build/ios/iphoneos
          tar -czvf ../../../../../aetheris-mobile-ios.tar.gz Runner.app

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact_path }}
            aetheris-mobile-ios.tar.gz
          name: ${{ matrix.release_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Web Build ---
  build-web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        run: |
          cd platforms/web
          wasm-pack build --target web --release

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build React App
        run: |
          cd platforms/web
          npm install
          npm run build

      - name: Compress Web Build
        run: |
          cd platforms/web
          tar -czvf ../../aetheris-web.tar.gz build/

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: aetheris-web.tar.gz
          name: Aetheris Web
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Browser Extension Builds ---
  build-browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - browser: chrome
            manifest: manifest.json
            artifact_name: aetheris-chrome
            artifact_ext: .zip
            release_name: Aetheris Browser (Chrome)
          - browser: firefox
            manifest: manifest-firefox.json
            artifact_name: aetheris-firefox
            artifact_ext: .xpi
            release_name: Aetheris Browser (Firefox)

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd platforms/browser
          npm install

      - name: Build Extension
        run: |
          cd platforms/browser
          npm run build

      - name: Package Extension
        run: |
          cd platforms/browser
          if [ "${{ matrix.browser }}" = "chrome" ]; then
            zip -r ../../${{ matrix.artifact_name }}${{ matrix.artifact_ext }} dist/
          else
            cp dist/*.xpi ../../${{ matrix.artifact_name }}${{ matrix.artifact_ext }}
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}${{ matrix.artifact_ext }}
          name: ${{ matrix.release_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- CLI Builds ---
  build-cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: aetheris-cli-windows
            artifact_ext: .exe
            release_name: Aetheris CLI (Windows)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: aetheris-cli-macos
            artifact_ext: ""
            release_name: Aetheris CLI (macOS)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: aetheris-cli-linux
            artifact_ext: ""
            release_name: Aetheris CLI (Linux)

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        run: |
          cd platforms/cli
          cargo build --target ${{ matrix.target }} --release

      - name: Rename Artifact
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv platforms/cli/target/${{ matrix.target }}/release/aetheris-cli.exe ${{ matrix.artifact_name }}${{ matrix.artifact_ext }}
          else
            mv platforms/cli/target/${{ matrix.target }}/release/aetheris-cli ${{ matrix.artifact_name }}${{ matrix.artifact_ext }}
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}${{ matrix.artifact_ext }}
          name: ${{ matrix.release_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}