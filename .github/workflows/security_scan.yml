name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: |
          echo "Running cargo-audit for security vulnerabilities..."
          cargo audit --json 2>&1 | tee audit_results.json || echo "Audit completed with warnings"
          
          # Check if vulnerabilities were found
          if grep -q '"vulnerabilities"' audit_results.json; then
            VULN_COUNT=$(grep -oP '"vulnerabilities": \[\K[^\]]*' audit_results.json | tr ',' '\n' | grep -c '"id"' || echo "0")
            echo "::warning::Found ${VULN_COUNT} vulnerabilities"
            
            if [ "$VULN_COUNT" -gt 0 ]; then
              echo "Vulnerabilities found:"
              cat audit_results.json | jq -r '.vulnerabilities[] | "- \(.id): \(.description)"'
              exit 1
            fi
          else
            echo "✓ No vulnerabilities found"
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: "security-audit-${{ github.run_id }}"
          path: audit_results.json
          retention-days: 7

  clippy-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libglib2.0-dev

      - name: Run clippy
        run: |
          echo "Running clippy for code quality..."
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy_results.txt

      - name: Upload clippy results
        uses: actions/upload-artifact@v4
        with:
          name: "clippy-results-${{ github.run_id }}"
          path: clippy_results.txt
          retention-days: 7

  gitleaks-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependabot-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Check Dependabot alerts
        run: |
          echo "Checking for Dependabot alerts..."
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/dependabot/alerts" \
            -o /tmp/dependabot.json
          if jq -e 'type == "array"' /tmp/dependabot.json >/dev/null 2>&1; then
            ALERT_COUNT=$(jq '[.[] | select(type == "object")] | length' /tmp/dependabot.json)
            if [ "$ALERT_COUNT" -gt 0 ]; then
              echo '::warning::Dependabot alerts found (informational, does not fail CI):'
              jq -r '.[] | select(type == "object") | "\(.dependency.package.name) (\(.dependency.scope)): \(.security_advisory.summary // .title // "see advisory")"' /tmp/dependabot.json
            else
              echo "No Dependabot alerts found"
            fi
          else
            echo "Could not fetch dependabot alerts; skipping"
          fi